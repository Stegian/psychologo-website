<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <title>Header Banner Carousel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<header>
    <div class="container">
        <div class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
                <li class="nav-item"><a href="index.html" class="nav-link">Αρχική</a></li>
                <li class="nav-item"><a href="Biografiko.html" class="nav-link">Βιογραφικό</a></li>
                <li class="nav-item"><a href="Diadikasia.html" class="nav-link">Διαδικασία</a></li>
                <li class="nav-item"><a href="Ypiresies.html" class="nav-link">Υπηρεσίες</a></li>
                <li class="nav-item"><a href="Articles.html" class="nav-link active" aria-current="page">Άρθρα</a></li>
                <li class="nav-item"><a href="Epikoinonia.html" class="nav-link">Επικοινωνία</a></li>
            </ul>
        </div>
    </div>

    <div class="header-carousel">
        <button class="slider-nav slider-nav--prev" aria-label="Προηγούμενη">‹</button>

        <div class="carousel-track">
            <!-- ΒΑΛΕ ΕΔΩ ΤΙΣ ΔΙΚΕΣ ΣΟΥ ΕΙΚΟΝΕΣ -->
            <div class="slide">
                <img src="images/image1.jpg" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="images/image2.jpg" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="images/image3.jpg" alt="Slide 3">
            </div>
            <div class="slide">
                <img src="images/image4.jpg" alt="Slide 4">
            </div>
            <div class="slide">
                <img src="images/image5.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image6.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image7.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image8.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image9.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image10.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image11.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image12.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image13.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image14.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image15.jpg" alt="Slide 5">
            </div>
            <div class="slide">
                <img src="images/image16.jpg" alt="Slide 5">
            </div>
            <!-- μπορείς να προσθέσεις κι άλλες -->
        </div>

        <button class="slider-nav slider-nav--next" aria-label="Επόμενη">›</button>

        <div class="dots-wrapper">
            <div class="dots"></div>
        </div>

    </div>
</header>

  <!-- απλό περιεχόμενο για να βλέπεις ότι είναι μόνο header -->
  <main style="padding: 2rem;">
    <h1>Υπόλοιπο σελίδας</h1>
    <p>Το slider πάνω είναι μόνο το header.</p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const slides = Array.from(document.querySelectorAll(".slide"));
      const track = document.querySelector(".carousel-track");
      const prevBtn = document.querySelector(".slider-nav--prev");
      const nextBtn = document.querySelector(".slider-nav--next");
      const dotsContainer = document.querySelector(".dots");
     
      let currentIndex = 0;
      let autoPlayId = null;
      const autoPlayDelay = 9000; // ms

      // Δημιουργία dots
      slides.forEach((_, i) => {
        const dot = document.createElement("button");
        dot.className = "dot" + (i === 0 ? " dot--active" : "");
        dot.dataset.index = String(i);
        dotsContainer.appendChild(dot);
      });

      const dots = Array.from(document.querySelectorAll(".dot"));

      function updateSlides() {
  const n = slides.length;
  const slideWidth = slides[0].offsetWidth || track.clientWidth * 0.7;
  const offsetX = slideWidth * 0.75;

  slides.forEach((slide, index) => {
    let offset = (index - currentIndex + n) % n;
    if (offset > n / 2) offset -= n;

    const x = offset * offsetX;
    const isCenter = offset === 0;
    const isSide = Math.abs(offset) === 1;

    const scale = isCenter ? 1 : 0.92;
    const y = isCenter ? -6 : 4;
    const opacity = isCenter ? 1 : (isSide ? 0.9 : 0);

    slide.style.transform =
      `translate(-50%, -50%) translateX(${x}px) translateY(${y}px) scale(${scale})`;
    slide.style.zIndex = String(n - Math.abs(offset));
    slide.style.opacity = String(opacity);

    // ενεργοποιούμε / σβήνουμε το zoom animation
    if (isCenter) {
      slide.classList.add("slide--active");
      // reset το animation κάθε φορά
      const img = slide.querySelector("img");
      img.style.animation = "none";
      void img.offsetWidth; // force reflow
      img.style.animation = "";
    } else {
      slide.classList.remove("slide--active");
    }
  });

  dots.forEach((dot, i) => {
    dot.classList.toggle("dot--active", i === currentIndex);
  });
}


      function goToSlide(index) {
        const n = slides.length;
        currentIndex = (index + n) % n; // κυκλικό
        updateSlides();
      }

      function stopAutoPlay() {
        if (autoPlayId !== null) {
          clearInterval(autoPlayId);
          autoPlayId = null;
        }
      }

      function startAutoPlay() {
        stopAutoPlay();
        autoPlayId = setInterval(() => {
          goToSlide(currentIndex + 1);
        }, autoPlayDelay);
      }

      function restartAutoPlay() {
        startAutoPlay();
      }

      prevBtn.addEventListener("click", () => {
        goToSlide(currentIndex - 1);
        restartAutoPlay();
      });

      nextBtn.addEventListener("click", () => {
        goToSlide(currentIndex + 1);
        restartAutoPlay();
      });

      slides.forEach((slide, index) => {
        slide.addEventListener("click", () => {
          goToSlide(index);
          restartAutoPlay();
        });
      });

      dots.forEach(dot => {
        dot.addEventListener("click", () => {
          const i = Number(dot.dataset.index);
          goToSlide(i);
          restartAutoPlay();
        });
      });

      window.addEventListener("resize", updateSlides);

      // αρχικό layout + autoplay
      updateSlides();
      startAutoPlay();
    });
  </script>
</body>
</html>
